---
deployment:
  tasks:
    - export DEPLOYPATH=/home/tmtro/public_html/wp-content
    - /bin/mkdir -p "$DEPLOYPATH/themes" "$DEPLOYPATH/plugins"
    - /bin/cp -Rf themes/martfury-child "$DEPLOYPATH/themes/"
    - if [ -d plugins ]; then for SOURCE in plugins/tmt-*; do [ -d "$SOURCE" ] || continue; /bin/cp -Rf "$SOURCE" "$DEPLOYPATH/plugins/"; done; fi
